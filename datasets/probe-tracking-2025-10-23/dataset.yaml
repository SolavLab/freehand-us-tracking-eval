# Dataset manifest for the freehand-US probe-tracking comparison.
#
# This file is the single source of truth: recordings and pipelines are addressed
# by the symbolic ids below, never by filename patterns. `legacy_test` and
# `legacy_dir` record the identifiers used in the original analysis trees, so
# results published before this release remain traceable.
id: probe-tracking-2025-10-23
session_date: 2025-10-23

vicon:
  # Authoritative sample rate. The Vicon Nexus export states it on line 4 of the
  # CSV; the loader asserts the two agree rather than trusting either alone.
  nominal_rate_hz: 240.0
  marker_prefix: "ZED:"
  marker_order: [top, back_left, back_right, front_right, front_left]
  nexus_version: "2.16"

recordings:
  pivot:
    label: 'Pivot'
    legacy_test: 2
    condition: pivot
    published: true
    duration_s: 55.1        # shared evaluation window, paper Table 2
  mixed:
    label: 'Mixed'
    legacy_test: 3
    condition: mixed
    published: true
    duration_s: 59.7        # shared evaluation window, paper Table 2
  freehand:
    label: 'Freehand'
    legacy_test: 5
    condition: freehand
    published: true
    duration_s: 46.9        # shared evaluation window, paper Table 2
  pivot-repeat:
    label: 'Pivot (repeat)'
    legacy_test: 1
    condition: pivot
    published: true
    duration_s: 37.4        # shared evaluation window, paper Table 2
    repeat_of: pivot
    note: >-
      Second acquisition of the pivot condition, used to assess
      trial-to-trial repeatability. Not an additional motion condition.

excluded:
  pivot-b:
    legacy_test: 4
    condition: pivot
    published: false
    exclusion: >-
      Vicon marker-cluster rigid-body fit residual was mean 0.497 mm
      (SD 0.338, max 3.800) within the shared evaluation window, against
      0.209-0.279 mm for the four retained recordings. Not shipped; the
      raw recording is listed in raw.yaml.

pipelines:
  zed-sdk:
    label: 'ZED SDK'
    legacy_dir: pipeline1_zed_sdk
    reported_frame: left_optical_sensor
  zed-cuvslam:
    label: 'ZED + cuVSLAM'
    legacy_dir: pipeline2_isaac_svo2
    reported_frame: configured_base_frame
    playback_rate: 0.4   # fraction of real time, to limit frame loss
  rs-cuvslam:
    label: 'RS + cuVSLAM'
    legacy_dir: pipeline3_isaac_realsense
    reported_frame: configured_base_frame
    playback_rate: 0.4   # fraction of real time, to limit frame loss

