[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vipose"
version = "1.0.0"
description = "Evaluation of visual-inertial pose-tracking pipelines against a motion-capture reference, for freehand 3D-ultrasound probe localization"
readme = "README.md"
requires-python = ">=3.10,<3.11"
# license = { file = "LICENSE" }   # pending: see docs/licensing.md
authors = [
    { name = "Zohar Oddes" },
    { name = "Dana Solav" },
]
keywords = [
    "freehand 3D ultrasound",
    "hand-eye calibration",
    "motion capture",
    "probe tracking",
    "SLAM",
    "visual-inertial odometry",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]

# Pinned to the exact versions that produced the published results. The upper
# bound on requires-python is deliberate rather than cautious: two of the four
# interpreters involved in the original work are 3.12, and running the
# evaluation under the wrong one silently changes numerics instead of failing.
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "opencv-python==4.13.0.92",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vipose = "vipose.cli:main"

[project.urls]
Repository = "https://github.com/ZoharOddes/us-tracking-release"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
# Both excluded directories hold code that is deliberately preserved verbatim.
#
# src/vipose/_legacy/ is the original evaluation code, byte-identical to the
# version that produced the published results -- that identity is what makes the
# golden master meaningful, so it must not be reformatted. It is being replaced
# module by module and will be deleted.
#
# tests/tools/ is the Phase-0 provenance harness, preserved as it was run.
extend-exclude = ["src/vipose/_legacy", "tests/tools"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# F403/F405 are errors, not warnings: the code this release was extracted from
# used `from SynchronizationNew import *`, which re-exported numpy, pandas,
# pyplot and even os.error into the calibration module's namespace. Dissolving
# that star import was a distinct phase of the port, and this gate keeps it
# from coming back.
extend-select = ["F401", "F403", "F405"]
